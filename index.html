    <nav class="nav__list" id="navlist">
      <button type="button" data-go="inicio"><span class="nav__num">01</span><span>Visão geral</span></button>
      <button type="button" data-go="cidades"><span class="nav__num">02</span><span>Cidades</span></button>
      <button type="button" data-go="diario"><span class="nav__num">03</span><span>Diário</span></button>
      <button type="button" data-go="checklist"><span class="nav__num">04</span><span>Falta comprar</span></button>

<noscript>
  <div class="boot">Este roteiro precisa de JavaScript ativado para funcionar.</div>
</noscript>

<div class="boot" id="boot">Carregando o roteiro…</div>

<script>
  // Diagnóstico de boot: se o módulo não subir (página aberta por file:// em vez
  // de um servidor http, por exemplo), a página explica em vez de ficar em branco.
  (function () {
    var boot = document.getElementById('boot');
    function fail(msg) {
      if (!boot || !boot.isConnected) return;
      boot.className = 'boot boot--err';
      boot.innerHTML = '<strong>O roteiro não carregou.</strong><br>' + msg;
    }
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && e.target.tagName) {
        fail('Falha ao carregar <code>' + (e.target.getAttribute('src') || e.target.getAttribute('href') || '') + '</code>.');
      } else if (e.message) {
        fail('Erro de JavaScript: <code>' + e.message + '</code>');
      }
    }, true);
    setTimeout(function () {
      if (location.protocol === 'file:') {
        fail('Abra por um servidor http, e não por <code>file://</code>.<br>' +
             'No terminal, dentro desta pasta: <code>python3 -m http.server 8000</code><br>' +
             'e acesse <code>http://localhost:8000</code>. No GitHub Pages funciona direto.');
      } else {
        fail('Veja o console do navegador (F12) para o motivo.');
      }
    }, 2500);
  })();
</script>
<script type="module" src="app.js"></script>

</body>
</html>
